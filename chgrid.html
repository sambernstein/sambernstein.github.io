<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Grid Game</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .container {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        margin-top: 20px;
    }
    .title {
        font-size: 48px;
        font-weight: bold;
        margin: 20px 0;
    }
    .grid-container {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-gap: 2px;
        width: 543px;
        margin-right: 30px;
        position: relative;
    }
    .tile {
        aspect-ratio: 1;
        width: 100%;
        cursor: pointer;
    }
    .green {
        background-color: green;
    }
    .red {
        background-color: red;
    }
    @keyframes fade-outline {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }
    .toggle-outline {
        position: absolute;
        border: 3px solid white;
        border-radius: 3px;
        pointer-events: none;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.6), inset 0 0 0 3px rgba(0,0,0,0.3);
        animation: fade-outline 0.6s linear forwards;
    }
    #message {
        font-size: 28px;
        margin-top: 15px;
        font-weight: bold;
        display: none;
    }
    #new-game-button {
        cursor: pointer;
        font-size: 18px;
        padding: 10px 20px;
        border: 2px solid black;
        background-color: white;
        margin-bottom: 10px;
    }
    #instructions {
        width: 400px;
    }
    #instr-text {
        font-size: 18px;
    }
    .stepper {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        vertical-align: middle;
    }
    .stepper-btn {
        width: 44px;
        height: 44px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid black;
        background: white;
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }
    .stepper-btn:active {
        background: #ddd;
    }
    #scramble-count {
        font-size: 18px;
        width: 64px;
        height: 44px;
        text-align: center;
        border: 2px solid black;
        border-radius: 8px;
        -moz-appearance: textfield;
        appearance: textfield;
    }
    #scramble-count::-webkit-outer-spin-button,
    #scramble-count::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    @media (max-width: 600px) {
        .title {
            font-size: 28px;
            margin: 12px 0 8px;
        }
        .container {
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
            padding: 0 16px;
            width: 100%;
        }
        .grid-container {
            width: calc(100vw - 32px);
            max-width: 400px;
            margin-right: 0;
            margin-bottom: 12px;
        }
        #instructions {
            width: auto;
            padding: 0 4px;
        }
        #instr-text {
            font-size: 14px;
        }
        #instr-text p {
            margin-bottom: 8px;
        }
        #message {
            font-size: 22px;
            margin-top: 8px;
        }
        #new-game-button {
            font-size: 16px;
            padding: 8px 16px;
            margin-bottom: 8px;
        }
        .stepper-btn {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }
        #scramble-count {
            font-size: 16px;
            width: 58px;
            height: 40px;
        }
    }
</style>
</head>
<body>
    <h1 class="title">Turn Them Green</h1>
    <div class="container">
        <div class="grid-container" id="grid-container"></div>
        <div>
            <div id="message">You won!</div>
            <div id="instructions">
                <div id="instr-text">
                    <p>
                        Click a tile to toggle the 3x3 area around it.<br>
                        Turn them all green to win!<br>
                        Hit "New Game" to scramble - higher numbers = harder.
                    </p>
                </div>
            </div>
            <button id="new-game-button">New Game</button>
            <div class="stepper">
                <button class="stepper-btn" id="stepper-minus">&minus;</button>
                <input type="number" id="scramble-count" min="0" max="9999" value="1" inputmode="numeric">
                <button class="stepper-btn" id="stepper-plus">+</button>
            </div>
        </div>
    </div>
    <script>
        const container = document.getElementById('grid-container');
        const message = document.getElementById('message');
        const newGameButton = document.getElementById('new-game-button');
        const scrambleCountInput = document.getElementById('scramble-count');
        const gridSize = 10;
        let tiles = [];

        function initializeTiles() {
            container.innerHTML = '';
for (let i = 0; i < gridSize; i++) {
tiles[i] = [];
for (let j = 0; j < gridSize; j++) {
const tile = document.createElement('div');
tile.className = 'tile green';
tile.onclick = () => toggleTiles(i, j, true);
tiles[i][j] = tile;
container.appendChild(tile);
}
}
}
    function scrambleTiles() {
        const count = parseInt(scrambleCountInput.value);
        for (let i = 0; i < count; i++) {
            const row = Math.floor(Math.random() * gridSize);
            const col = Math.floor(Math.random() * gridSize);
            toggleTiles(row, col);
        }
    }

    function toggleTiles(row, col, animate) {
        const minRow = Math.max(0, row - 1);
        const maxRow = Math.min(gridSize - 1, row + 1);
        const minCol = Math.max(0, col - 1);
        const maxCol = Math.min(gridSize - 1, col + 1);

        for (let i = minRow; i <= maxRow; i++) {
            for (let j = minCol; j <= maxCol; j++) {
                tiles[i][j].classList.toggle('green');
                tiles[i][j].classList.toggle('red');
            }
        }

        if (animate) {
            const gridRect = container.getBoundingClientRect();
            const tlRect = tiles[minRow][minCol].getBoundingClientRect();
            const brRect = tiles[maxRow][maxCol].getBoundingClientRect();

            const overlay = document.createElement('div');
            overlay.className = 'toggle-outline';
            overlay.style.top = (tlRect.top - gridRect.top) + 'px';
            overlay.style.left = (tlRect.left - gridRect.left) + 'px';
            overlay.style.width = (brRect.right - tlRect.left) + 'px';
            overlay.style.height = (brRect.bottom - tlRect.top) + 'px';
            container.appendChild(overlay);
            overlay.addEventListener('animationend', function() {
                overlay.remove();
            }, { once: true });
        }

        checkWinCondition();
    }

    function checkWinCondition() {
        let allGreen = true;
        for (let i = 0; i < gridSize; i++) {
            for (let j = 0; j < gridSize; j++) {
                if (!tiles[i][j].classList.contains('green')) {
                    allGreen = false;
                    break;
                }
            }
            if (!allGreen) {
                break;
            }
        }
        if (allGreen) {
            message.style.display = 'block';
            showWinOutline();
        } else {
            message.style.display = 'none';
        }
    }

    function showWinOutline() {
        const gridRect = container.getBoundingClientRect();
        const tlRect = tiles[0][0].getBoundingClientRect();
        const brRect = tiles[gridSize - 1][gridSize - 1].getBoundingClientRect();

        const overlay = document.createElement('div');
        overlay.className = 'toggle-outline';
        overlay.style.top = (tlRect.top - gridRect.top) + 'px';
        overlay.style.left = (tlRect.left - gridRect.left) + 'px';
        overlay.style.width = (brRect.right - tlRect.left) + 'px';
        overlay.style.height = (brRect.bottom - tlRect.top) + 'px';
        container.appendChild(overlay);
        overlay.addEventListener('animationend', function() {
            overlay.remove();
        }, { once: true });
    }
    function newGame() {
        initializeTiles();
        scrambleTiles();
        message.style.display = 'none';
    }

    newGameButton.onclick = newGame;

    const stepperPlus = document.getElementById('stepper-plus');
    const stepperMinus = document.getElementById('stepper-minus');

    function clampValue() {
        let v = parseInt(scrambleCountInput.value) || 0;
        v = Math.max(0, Math.min(9999, v));
        scrambleCountInput.value = v;
    }

    function stepValue(delta) {
        let v = parseInt(scrambleCountInput.value) || 0;
        v = Math.max(0, Math.min(9999, v + delta));
        scrambleCountInput.value = v;
    }

    scrambleCountInput.addEventListener('change', clampValue);
    scrambleCountInput.addEventListener('blur', clampValue);

    function setupHoldRepeat(btn, delta) {
        let holdTimeout, holdInterval;

        function startHold(e) {
            e.preventDefault();
            stepValue(delta);
            holdTimeout = setTimeout(function() {
                holdInterval = setInterval(function() {
                    stepValue(delta);
                }, 80);
            }, 400);
        }

        function stopHold() {
            clearTimeout(holdTimeout);
            clearInterval(holdInterval);
        }

        btn.addEventListener('mousedown', startHold);
        btn.addEventListener('touchstart', startHold, { passive: false });
        btn.addEventListener('mouseup', stopHold);
        btn.addEventListener('mouseleave', stopHold);
        btn.addEventListener('touchend', stopHold);
        btn.addEventListener('touchcancel', stopHold);
    }

    setupHoldRepeat(stepperPlus, 1);
    setupHoldRepeat(stepperMinus, -1);

    initializeTiles();
    scrambleTiles();
</script>
</body>
</html>
